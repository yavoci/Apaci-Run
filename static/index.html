<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apaçi Run</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1a1c2c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#94b0c2;--fg:#1a1c2c;--bt:#333c57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1c2c;--fg:#f4f4f4;--bt:#566c86}}
:root[data-theme="dark"]{--bg:#1a1c2c;--fg:#f4f4f4;--bt:#566c86}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:10px "Press Start 2P",monospace;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{image-rendering:pixelated;width:min(100%,calc((100dvh - 64px) * .6667));aspect-ratio:2/3;touch-action:none;display:block}
button{font:inherit;color:var(--fg);background:transparent;border:2px solid var(--bt);padding:6px 10px;cursor:pointer}
.r{display:flex;gap:8px}
dialog{background:var(--bg);color:var(--fg);border:2px solid var(--bt);font:inherit;line-height:2;text-align:center}
dialog input{font:inherit;color:var(--fg);background:transparent;border:2px solid var(--bt);padding:6px;width:85%;text-align:center}
dialog p{margin:6px 0}
</style></head><body>
<canvas id="g" width="160" height="240"></canvas>
<button id="a">GİRİŞ YAP</button>
<dialog id="d"><p>E-postanı yaz, sana 9 haneli kod gönderelim.</p><p><input id="em" type="email" placeholder="e-posta" autocomplete="email"></p><p id="cr" hidden><input id="cd" inputmode="numeric" maxlength="9" placeholder="9 haneli kod" autocomplete="one-time-code"></p><p><button id="go">KOD GÖNDER</button> <button id="x">KAPAT</button></p><p id="ms"></p></dialog>
<script>
const C=document.getElementById('g'),X=C.getContext('2d');
X.imageSmoothingEnabled=false;
const W=160,H=240,HZ=64,GY=196;
// 16 renk = 4 bit (Sweetie-16 paleti)
const P=['#1a1c2c','#5d275d','#b13e53','#ef7d57','#ffcd75','#a7f070','#38b764','#257179','#29366f','#3b5dc9','#41a6f6','#73eff7','#f4f4f4','#94b0c2','#566c86','#333c57'];
const R=(x,y,w,h,c)=>{X.fillStyle=P[c];X.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))};
const S=z=>1/(1+3*z),Yg=s=>HZ+(GY-HZ)*s,Xl=(l,s)=>80+l*34*s;
const T=(s,x,y,c,sz,al)=>{X.font=(sz||8)+'px "Press Start 2P",monospace';X.textAlign=al||'center';X.textBaseline='top';X.fillStyle=P[0];X.fillText(s,x+1,y+1);X.fillStyle=P[c];X.fillText(s,x,y)};
let st='menu',t=0,dist=0,spd=.55,coins=0,lane=0,px=0,ax=0,jy=0,jv=0,sl=0,near=0,inv=0,ob=[],cn=[],sp=0,shake=0,said='',saidT=0,ovAt=0,scroll=0,mp=0,ev=0,storm=0,stun=0,sK=1,msg='';
const MAPS=[
 {n:'NORMAL',d:'MEVCUT HARİTA',sky:[[0,8],[16,1],[28,2],[40,3]],sun:4,sk:'b',bc:15,wc:4,rd:15,s1:13,s2:14,ed:4,ln:12,tr:0,bp:165},
 {n:'ÇÖL',d:'FIRTINA YAVAŞLATIR',sky:[[0,10],[18,11],[34,4],[50,3]],sun:12,sk:'p',bc:2,rd:14,s1:4,s2:3,ed:2,ln:12,tr:2,bp:155},
 {n:'KUTUP',d:'AYI + BUZ KAYMASI',sky:[[0,9],[18,10],[36,11],[52,12]],sun:12,sk:'p',bc:13,rd:14,s1:12,s2:13,ed:11,ln:12,tr:-2,bp:150,ks:['bar','sign','bear']},
 {n:'ORMAN',d:'SARMAŞIK TUZAĞI',sky:[[0,8],[20,7],[36,6],[52,5]],sun:4,sk:'t',bc:0,rd:15,s1:6,s2:7,ed:5,ln:4,tr:-5,bp:160},
 {n:'CEHENNEM',d:'ŞEYTAN + ATEŞ = ÖLÜM',sky:[[0,0],[16,1],[30,2],[44,3]],sun:null,sk:'p',bc:15,rd:0,s1:2,s2:1,ed:4,ln:3,tr:-4,bp:185,dev:1},
 {n:'ŞEHİR',d:'ARABA GEÇİŞİ',sky:[[0,10],[30,11],[52,12]],sun:null,sk:'b',bc:14,wc:12,rd:15,s1:13,s2:12,ed:4,ln:12,tr:3,bp:170}
];
const TOT=[150,120,95,100,120,150],ORD=[0,5,1,4,3,2],PRE={5:0,1:5,4:1,3:4,2:3};
let pz=false,md='e',lvl=1,d0=0,bs=null,kh=3,gc=0,sh=0,shc=0,LV=MAPS.map(()=>1),DN=MAPS.map(()=>0);
try{const q=JSON.parse(localStorage.getItem('apaci-prog'));if(q){LV=q.LV;DN=q.DN}}catch(e){}
const sv=()=>{try{localStorage.setItem('apaci-prog',JSON.stringify({LV,DN}))}catch(e){}};
const unl=i=>i===0||!!DN[PRE[i]];
const KC=[2,3,4,6,8,9,10,12],APC=[[6,12],[2,12],[9,12],[4,0],[12,14],[0,12]];
let OT=[2,8,9],ac=0;
try{const q=JSON.parse(localStorage.getItem('apaci-dress'));if(q){OT=q.OT;ac=q.ac}}catch(e){}
const svd=()=>{try{localStorage.setItem('apaci-dress',JSON.stringify({OT,ac}))}catch(e){}};
const acOk=i=>i<4||(i===4?HI[1]>=7000:HI[2]>=6500);
const K=i=>i?'apaci-hi'+i:'apaci-hi';
const HI=MAPS.map((_,i)=>{try{return+localStorage.getItem(K(i))||0}catch(e){return 0}});
const LN=['DUR LAN!','AGA BEKLE!','YAA ABİ GEL!','KAÇMA OĞLUM!','KANKA DUR!'];
const LD=['GEL BURAYA!','KAÇAMAZSIN!','RUHUN BENİM!','DUR DA YAN!','BURASI SENİN!'];
const score=()=>Math.floor(dist)+coins*10;
const BL=[];for(let x=0;x<W;x+=13)BL.push([x,(10+Math.random()*30)|0]);

// ---------- SES: 4 bit (16 seviyeli) chiptune ----------
let AC,mg,sg,bus,QC,NB,on=true,step=0,nxt=0,MV=.8,SV=.8,stg=false;
try{const q=JSON.parse(localStorage.getItem('apaci-set'));if(q&&q.m>=0&&q.m<=1&&q.s>=0&&q.s<=1){MV=q.m;SV=q.s}}catch(e){}
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 QC=new Float32Array(257);for(let i=0;i<257;i++)QC[i]=Math.round(i/128*7.5)/7.5-1;
 mg=AC.createGain();mg.gain.value=MV*.25;sg=AC.createGain();sg.gain.value=SV*.25;mg.connect(AC.destination);sg.connect(AC.destination);
 AC.onstatechange=()=>{if(st==='play'&&!pz&&AC.state!=='running')AC.resume().catch(()=>{})};
 NB=AC.createBuffer(1,AC.sampleRate>>1,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.round((Math.random()*2-1)*7.5)/7.5}
function tone(f,t0,d,ty,v,f2){const o=AC.createOscillator(),q=AC.createWaveShaper(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);q.curve=QC;o.connect(q);q.connect(g);g.connect(bus||mg);g.gain.setValueAtTime(v,t0);g.gain.linearRampToValueAtTime(0,t0+d);o.start(t0);o.stop(t0+d+.02)}
function nz(t0,d,v){const b=AC.createBufferSource(),g=AC.createGain();b.buffer=NB;b.connect(g);g.connect(bus||mg);g.gain.setValueAtTime(v,t0);g.gain.linearRampToValueAtTime(0,t0+d);b.start(t0);b.stop(t0+d+.02)}
const hz=m=>440*2**((m-69)/12);
// Hicaz dizisi (Re): D Eb F# G A Bb C D
const ML=[74,0,72,74,0,70,69,0,70,0,72,70,69,0,67,0,66,0,67,69,0,67,66,63,62,0,63,66,0,63,62,0];
const BS=[38,0,38,0,38,0,38,50,38,0,38,0,39,0,45,0];
function play(i,t0,sd){const m=ML[i%32],b=BS[i%16];
 if(m)tone(hz(m+MAPS[mp].tr),t0,sd*1.6,'square',.5);
 if(b)tone(hz(b+MAPS[mp].tr),t0,sd*1.8,'triangle',.9);
 if(i%4===0)tone(150,t0,.14,'triangle',1,40);
 if(i%8===4)nz(t0,.1,.5);
 if(i%2===1)nz(t0,.03,.2)}
setInterval(()=>{if(!AC||!on||st!=='play'||pz)return;if(AC.state!=='running'){AC.resume().catch(()=>{});return}const sd=60/(MAPS[mp].bp+(spd-.55)*40)/4;if(nxt<AC.currentTime)nxt=AC.currentTime+.05;while(nxt<AC.currentTime+.3){play(step,nxt,sd);nxt+=sd;step++}},40);
function sfx(k){if(!AC||!on)return;bus=sg;try{sfx2(k)}finally{bus=null}}
function sfx2(k){const n=AC.currentTime;
 if(k==='c'){tone(988,n,.06,'square',.5);tone(1319,n+.06,.1,'square',.5)}
 else if(k==='j')tone(300,n,.15,'square',.4,700);
 else if(k==='h'){nz(n,.25,.9);tone(120,n,.25,'triangle',1,40)}}

// ---------- OYUN ----------
function start(){audio();st='play';dist=0;spd=.55;coins=0;lane=px=ax=0;jy=jv=sl=0;near=0;inv=0;ob=[];cn=[];sp=.4;said='';saidT=-2;ev=6;storm=0;stun=0;bs=null;kh=3;d0=0;pz=false;if(md==='l'){lvl=LV[mp];if(lvl>=TOT[mp])initB()}if(AC){AC.resume();nxt=AC.currentTime+.08;step=0}}
function over(m){st='over';msg=m||'YAKALANDIN!';ovAt=t;shake=.4;sfx('h');const s=score();if(md==='e'&&s>HI[mp]){HI[mp]=s;try{localStorage.setItem(K(mp),s)}catch(e){}}}
function hitP(k){if(bs){kh--;inv=1.2;shake=.3;sfx('h');if(kh<=0)over('YENİLDİN!');return}if(near>.5){over(k==='fall'?'DÜŞTÜN!':'');return}near=1;inv=1.2;shake=.3;sfx('h');said=k==='fall'?'YERE DÜŞTÜN!':k==='vine'?'SARMAŞIK!':MAPS[mp].dev?'YAKALADIM!':'YAKALIYORUM!';saidT=1.5;if(k==='fall'){stun=.9;sK=.25;inv=2.1}else if(k==='vine'){stun=2;sK=0;inv=3.2}}
function spawn(){const r=Math.random();
 if(r<.3){const l=(Math.random()*3|0)-1;for(let i=0;i<5;i++)cn.push({l,z:1.6+i*.06,a:1})}
 else{const n=Math.random()<.35?2:1,ls=[-1,0,1].sort(()=>Math.random()-.5);
  for(let i=0;i<n;i++)ob.push({l:ls[i],z:1.6,k:(MAPS[mp].ks||['bar','sign','crate'])[Math.random()*3|0]});
  if(Math.random()<.5)cn.push({l:ls[2],z:1.6,a:1})}}
const LEN=()=>250+150*lvl/TOT[mp];
function initB(){const dv=MAPS[mp].dev,mx=dv?100:15+3*ORD.indexOf(mp);bs={hp:mx,mx,l:0,x:0,mv:1,at:2,z:.5};kh=3;gc=0;sh=0;shc=0;ob=[];cn=[];said=dv?'ŞEYTAN GELDİ!':'SAVAŞ BAŞLADI!';saidT=2}
function nextLv(){lvl++;LV[mp]=Math.max(LV[mp],lvl);sv();d0=dist;ev=Math.min(ev,2);said='BÖLÜM '+lvl;saidT=1.6;if(lvl>=TOT[mp])initB()}
function winB(){DN[mp]=1;sv();bs=null;st='over';msg='AŞAMA BİTTİ!';ovAt=t;shake=.4}
const fire=()=>{if(gc<=0){gc=.25;ob.push({k:'bu',l:Math.round(px),z:.02,h:1,dm:1});sfx('j')}};
const shield=()=>{if(shc<=0){sh=.8;shc=60}};
function updB(dt){bs.x+=(bs.l-bs.x)*Math.min(1,dt*5);bs.mv-=dt;if(bs.mv<=0){bs.l=(Math.random()*3|0)-1;bs.mv=1+Math.random()*1.2}
 bs.at-=dt;if(bs.at<=0){const dv=MAPS[mp].dev;bs.at=(dv?1.6:1.1)*(.6+.4*bs.hp/bs.mx);ob.push({k:dv?'fb':'pr',l:Math.random()<.6?Math.round(px):(Math.random()*3|0)-1,z:bs.z,h:0})}
 if(gc>0)gc-=dt;if(shc>0)shc-=dt;if(sh>0){sh-=dt;for(const o of ob)if(o.k==='fb'&&o.z<.35){o.k='bu';o.dm=34;o.hm=1;o.h=1;sh=0;sfx('c');break}}}
function special(){const n=mp;if(md==='l'&&lvl<2){ev=99;return}
 if(n===1){storm=4;ev=10+Math.random()*6;said='ÇÖL FIRTINASI!';saidT=1.5}
 else if(n===2){ob.push({k:'ice',l:0,z:1.6});ev=5+Math.random()*4}
 else if(n===3){const ls=[-1,1].sort(()=>Math.random()-.5);for(let i=0;i<(Math.random()<.4?2:1);i++)ob.push({k:'vine',l:ls[i],z:1.6});ev=5+Math.random()*3;sp=Math.max(sp,.45)}
 else if(n===4){ob.push({k:'fire',l:(Math.random()*3|0)-1,z:1.1});ev=5+Math.random()*7;shake=.3;said='ASAYI VURDU!';saidT=1.2}
 else if(n===5){const d=Math.random()<.5?1:-1;ob.push({k:'car',l:0,z:1.3,cx:-d*3,dir:d,col:[2,9,4,6,12][Math.random()*5|0]});ev=4+Math.random()*4}
 else ev=99;if(md==='l')ev*=Math.max(.6,2.4-1.8*(lvl-1)/(TOT[mp]-1))}
function upd(dt){let v=spd*(storm>0?.55:1)*(stun>0?sK:1);dist+=v*dt*60;spd=md==='l'?.55+.6*lvl/TOT[mp]:Math.min(1.4,.55+dist*.0003);if(bs)spd=.6;if(md==='l'&&!bs&&dist-d0>=LEN())nextLv();
 if(stun>0)stun-=dt;if(storm>0){storm-=dt;if(near<.75)near=Math.min(.75,near+dt*.5)}
 ev-=dt;if(ev<=0&&!bs)special();
 px+=(lane-px)*Math.min(1,dt*14);ax+=(px-ax)*Math.min(1,dt*3);
 if(jy>0||jv>0){jv-=630*dt;jy+=jv*dt;if(jy<=0){jy=0;jv=0}}
 if(sl>0)sl-=dt;if(inv>0)inv-=dt;if(shake>0)shake-=dt;near=Math.max(0,near-dt*.15);
 saidT-=dt;if(saidT<-5){said=(MAPS[mp].dev?LD:LN)[Math.random()*5|0];saidT=1.6}
 if(bs)updB(dt);else{sp-=v*dt;if(sp<=0){spawn();sp=(.3+Math.random()*.2)*(md==='l'?1.35-.5*lvl/TOT[mp]:1)}}
 for(const o of ob){o.z-=v*dt;if(o.k==='bu'){o.z+=(v+2.2)*dt;if(o.hm)o.l+=(bs.x-o.l)*Math.min(1,dt*6);if(o.z>=bs.z){if(o.hm||Math.abs(o.l-bs.x)<.7){bs.hp-=o.dm;sfx('c')}o.z=9;if(bs.hp<=0){winB();return}}continue}if(o.k==='car'){o.cx+=o.dir*dt*2.4;if(inv<=0&&Math.abs(o.z)<.04&&Math.abs(px-o.cx)<.75&&jy<14){hitP('fall');if(st!=='play')return}}
  if(!o.h&&o.z<.02&&o.k!=='car'){o.h=1;const k=o.k,ok=k==='ice'||Math.abs(px-o.l)<.6;if(ok&&k==='fire'){over('YANDIN!');return}if(inv<=0&&ok){if(k==='vine')hitP('vine');else if(k==='ice'){if(jy<8)hitP('fall')}else if(k==='crate'||k==='bear'||k==='pr'||k==='fb'||(k==='bar'&&jy<11)||(k==='sign'&&sl<=0))hitP('hit');if(st!=='play')return}}}
 for(const c of cn){c.z-=v*dt;if(c.a&&c.z<.06&&Math.abs(px-c.l)<.6){c.a=0;coins++;sfx('c')}}
 ob=ob.filter(o=>o.z>-.1&&o.z<5);cn=cn.filter(c=>c.z>-.1);scroll+=v*dt}

function drawOb(o){const s=S(o.z),x=Xl(o.k==='car'?o.cx:o.l,s),y=Yg(s),r=(dx,dy,w,h,c)=>R(x+dx*s,y+dy*s,w*s,h*s,c);
 if(o.k==='pr'||o.k==='fb'||o.k==='bu'){const f=o.k==='fb'||o.dm>1;if(o.k==='bu'&&!f)r(-2,-14,4,4,12);else{r(-5,-16,10,10,f?2:4);r(-3,-14,6,6,3);r(-1,-12,2,2,f?4:0)}return}
 if(o.k==='ice'){const ya=Math.max(HZ,Math.round(Yg(S(o.z+.14)))),yb=Math.min(H,Math.round(y));for(let yy=ya;yy<yb;yy++){const e=51*(yy-HZ)/(GY-HZ);R(80-e,yy,e*2,1,yy%4?11:12)}return}
 if(o.k==='bear'){r(-12,-20,24,20,12);r(-12,-20,24,2,13);r(-12,-6,4,6,13);r(8,-6,4,6,13);r(-6,-31,12,11,12);r(-7,-32,3,3,12);r(4,-32,3,3,12);r(-3,-27,2,2,0);r(1,-27,2,2,0);r(-3,-23,6,4,13);r(-1,-23,2,2,0);return}
 if(o.k==='vine'){r(-14,-40,28,4,7);for(let i=0;i<7;i++){r(-13+i*4.4,-38,3,32+(i%2)*6,6);r(-12+i*4.4,-38,1,32+(i%2)*6,5)}return}
 if(o.k==='fire'){for(let i=0;i<5;i++){const h=22+Math.sin(t*14+i*2)*6;r(-14+i*5.6,-h,6,h,2);r(-13+i*5.6,-h*.7,4,h*.7,3);r(-12+i*5.6,-h*.4,2,h*.4,4)}return}
 if(o.k==='car'){r(-14,-9,28,7,o.col);r(-8,-15,16,6,o.col);r(-6,-14,12,4,11);r(-13,-3,6,3,0);r(7,-3,6,3,0);r(o.dir>0?12:-14,-8,2,3,4);return}
 if(o.k==='crate'){r(-13,-24,26,24,2);r(-11,-22,22,20,3);r(-11,-13,22,2,2);r(-1,-22,2,20,2)}
 else if(o.k==='bar'){r(-12,-6,3,6,14);r(9,-6,3,6,14);r(-13,-12,26,7,12);for(let i=0;i<4;i++)r(-13+i*7,-12,3.5,7,2)}
 else{r(-12,-36,2,36,14);r(10,-36,2,36,14);r(-14,-38,28,12,4);for(let i=0;i<4;i++)r(-12+i*7,-38,3.5,12,0)}}
function coin(c){const s=S(c.z),x=Xl(c.l,s),y=Yg(s)-10*s,w=(Math.abs(Math.cos(t*6+c.z*10))*6+1)*s;
 R(x-w/2,y-4*s,w,8*s,4);R(x-w/4,y-3*s,w/2,6*s,3)}
function kid(x,y,s,ph,sld,fl){const r=(dx,dy,w,h,c)=>R(x+dx*s,y+dy*s,w*s,h*s,c===2?OT[0]:c===8?OT[1]:c===9?OT[2]:c);if(fl){r(-12,-5,16,5,2);r(4,-5,9,5,8);r(-17,-7,6,7,0);r(-17,-9,6,3,9);return}
 if(sld){r(-5,-5,4,5,8);r(1,-5,4,5,8);r(-6,-14,12,9,2);r(-4,-20,8,6,0);r(-5,-22,10,4,9);return}
 const a=Math.sin(ph)*3,l1=Math.max(0,a),l2=Math.max(0,-a);
 r(-5,-8-l1,4,6,8);r(1,-8-l2,4,6,8);r(-5,-2-l1,4,2,12);r(1,-2-l2,4,2,12);
 r(-9,-18+a*.4,3,7,2);r(6,-18-a*.4,3,7,2);r(-6,-19,12,11,2);r(-4,-18,8,8,3);
 r(-3,-21,6,2,4);r(-5,-27,10,6,0);r(-6,-30,12,5,9)}
function apc(x,y,s,ph){const r=(dx,dy,w,h,c)=>R(x+dx*s,y+dy*s,w*s,h*s,c===6?APC[ac][0]:c);
 const a=Math.sin(ph)*3,l1=Math.max(0,a),l2=Math.max(0,-a);
 r(-6,-10-l1,5,8,6);r(1,-10-l2,5,8,6);r(-6,-2-l1,5,2,12);r(1,-2-l2,5,2,12);r(-6,-10-l1,1,8,APC[ac][1]);r(5,-10-l2,1,8,APC[ac][1]);
 r(-10,-24+a*.4,3,9,6);r(7,-24-a*.4,3,9,6);
 r(-8,-26,16,16,6);r(-8,-26,2,16,APC[ac][1]);r(6,-26,2,16,APC[ac][1]);
 r(-5,-27,10,1,4);r(-5,-28,1,3,4);r(4,-28,1,3,4);
 r(-14,-34,9,6,15);r(-13,-33,3,4,14);r(-9,-33,3,4,14);
 r(-5,-35,10,9,3);r(-6,-32,1,3,0);r(5,-32,1,3,0);
